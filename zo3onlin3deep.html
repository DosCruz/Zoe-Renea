
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One moment...</title>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
    }

    p {
      color: #aaa;
      font-size: 14px;
    }

    #captcha {
      margin-top: 20px;
    }

    #status {
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <h1>Just checking you're real...</h1>
  <p>Please wait a moment.</p>

  <div
    id="captcha"
    class="cf-turnstile"
    data-sitekey="0x4AAAAAAF7i5NnB5viFYXsa"
    data-theme="dark"
    data-callback="onVerified"
    data-error-callback="onError"
    data-expired-callback="onExpired"
  ></div>

  <p id="status" role="status">Verifying...</p>

  <script>
    async function onVerified(token) {
      const status = document.getElementById("status");
      status.textContent = "Verification in progress...";

      try {
        const response = await fetch(
          "https://link-host-verification.diosdado-delacruz0314.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ token })
          }
        );

        const result = await response.json();

        if (response.ok && result.success === true) {
          status.textContent = "Verified. Continuing...";

          setTimeout(() => {
            window.location.href = "zo3onlin3redirect.html";
          }, 700);
        } else {
          status.textContent =
            "Verification failed. Please refresh and try again.";
        }
      } catch (error) {
        status.textContent =
          "Unable to verify right now. Please check your connection and retry.";
      }
    }

    function onError() {
      document.getElementById("status").textContent =
        "Verification couldn't load. Please refresh and try again.";
    }

    function onExpired() {
      document.getElementById("status").textContent =
        "Verification expired. Please refresh and try again.";
    }
  </script>
</body>
</html>
